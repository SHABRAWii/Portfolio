<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous warehouse mobile robot</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; }
        canvas { display: block; }
                /* Instructions overlay */
        #instructions {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: rgba(0, 0, 0, 0.7); /* Slightly transparent background */
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 10; /* Ensure it stays on top */
            max-width: 300px; /* Optional: limit the width */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); /* Add subtle shadow */
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <div id="instructions">
        <strong>3D Model Viewer Instructions</strong>
        <p>Use your mouse or touch gestures to rotate, zoom, and pan the model.</p>
    </div>
<script>
    function init() {

        // Load the PNG image as a texture
        const textureLoader = new THREE.TextureLoader();
        textureLoader.load('sunnykitchen.png', function(texture) {
            // Set the texture as the scene background
            scene.background = texture;
        }, undefined, function(error) {
            console.error('An error happened while loading the background image:', error);
        });

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0xffffff, 1); // Set background color to white
        renderer.shadowMap.enabled = true;   // Enable shadow maps
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; // Soft shadow
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        // Directional light settings
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(8, 10, -2);
        directionalLight.castShadow = true;  // Enable shadows for this light

        // Increase shadow map resolution for softer shadows
        directionalLight.shadow.mapSize.width = 2048; // Try a higher value for more detail
        directionalLight.shadow.mapSize.height = 2048;

        // Adjust the shadow bias to remove the lines
        directionalLight.shadow.bias = -0.0001; // Fine-tune this value if needed

        directionalLight.shadow.camera.near = 0.5;
        directionalLight.shadow.camera.far = 500;
        directionalLight.shadow.camera.left = -10;
        directionalLight.shadow.camera.right = 10;
        directionalLight.shadow.camera.top = 10;
        directionalLight.shadow.camera.bottom = -10;

        scene.add(directionalLight);


        // Add ground plane to receive shadows
        const planeGeometry = new THREE.PlaneGeometry(200, 200);
        const planeMaterial = new THREE.ShadowMaterial({ opacity: 0.5 });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI / 2;
        plane.position.y = -1.0;
        plane.position.x = -1;
        plane.receiveShadow = true;  // Make the plane receive shadows
        scene.add(plane);

        // Add orbit controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // Enable damping for smooth orbiting
        controls.dampingFactor = 0.2;  // Increase damping for smoothness
        controls.rotateSpeed = 1.5;    // Increase for faster rotation
        controls.enablePan = true;
        controls.enableZoom = true;
        controls.zoomSpeed = 1.5;
        controls.minDistance = 0.1;
        controls.maxDistance = 3;

        // Animation mixer
        let mixer; // Declare mixer variable to control animations

        // Load the GLTF/GLB model
        const loader = new THREE.GLTFLoader();
        loader.setPath('Warehouse_Workstation_V2/');
        loader.load('Warehouse_Workstation_V2.gltf', function(gltf) {
            const model = gltf.scene;
            model.traverse(function(node) {
                if (node.isMesh) {
                    node.castShadow = true;    // Make the object cast shadows
                    node.receiveShadow = true; // Make the object receive shadows
                }
            });

            scene.add(model);

            // Center the model and set the camera
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            model.position.sub(center);
            // Adjust animation keyframe positions
            if (gltf.animations && gltf.animations.length > 0) {
                gltf.animations.forEach((animation) => {
                    animation.tracks.forEach((track) => {
                        if (track.name.endsWith('.position')) {
                            // Create new arrays for filtered values and times
                            const newValues = [];
                            const newTimes = [];

                            // Adjust all position keyframes
                            var idx_time = -1;
                            for (let i = 0; i < track.values.length; i += 3) {
                                
                                track.values[i] *= 0.65;  // Adjust X
                                track.values[i] -= 0.2;     // Adjust X
                                track.values[i + 1] -= 0.55; // Adjust Y
                                // track.values[i + 1] *= 0.5;  // Adjust Y
                                track.values[i + 2] -= 0.1; // Adjust Z
                                // Check if the Y value meets the threshold
                                if (track.values[i + 1] >= 0.18  ) {
                                    // Keep the corresponding x, y, z and timestamp
                                    newValues.push(track.values[i], track.values[i + 1], track.values[i + 2]);
                                    if(idx_time == 0)
                                        newTimes.push(0); // Time index matches position index
                                    else
                                        newTimes.push(newTimes[idx_time] + 0.03333333); // Time index matches position index
                                    ++idx_time;

                                }
                                console.log("Time: ", track.times[i / 3] - track.times[i / 3 - 1]);

                            }

                            // Update the track with the filtered values and times
                            track.values = new Float32Array(newValues); // Update values
                            track.times = new Float32Array(newTimes);   // Update times
                        }
                    });
                });

                // Set up animation mixer
                mixer = new THREE.AnimationMixer(model);
                action = mixer.clipAction(gltf.animations[0]); // Play the first animation clip

                // Set up animation playback
                action.setLoop(THREE.LoopOnce); // Play once in each direction
                action.clampWhenFinished = true; // Stop at the last frame when finished
                action.play(); // Play the animation forward

                // Add event listener for when the animation ends
                mixer.addEventListener('finished', () => {
                    // Reverse the animation by inverting the timeScale
                    action.timeScale *= -1; // Reverse playback
                    action.paused = false; // Unpause the animation
                    action.play(); // Play it in reverse
                });
            }

            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const fov = camera.fov * (Math.PI / 180);
            let cameraZ = Math.abs(maxDim / 2 * Math.tan(fov * 2)); 
            cameraZ *= 1.5; // Adjust zoom out distance

            // Set the camera to an isometric view
            
            camera.position.set(model.position.x + 4.1, model.position.y + 4.5, model.position.z + 6.5);
            // controls.target.copy(center);
            // controls.update();
            controls.target = new THREE.Vector3(0,0,0);
            controls.update();
        }, undefined, function(error) {
            console.error('An error happened while loading the model:', error);
        });
        // Resize handler
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            renderer.setSize(width, height);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
        });
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            if (mixer) {
                // Update the animation mixer on each frame
                const delta = clock.getDelta();
                mixer.update(delta);
            }
            renderer.render(scene, camera);
        }
        const clock = new THREE.Clock(); // Clock for animation timing
        animate();
    }

    init();
</script>

</body>
</html>
